  commit: "2a8882f56147bab5cf392ed0024325c99b89668b"
  verified_at: "2026-10-31T12:55:59Z"
  tests:
    - command: "cd examples/unittest-discovery && python3 -m unittest"
      result: "커밋 2a8882f 기준 Python 3.9.6에서는 exit 0, `Ran 0 tests`, `OK`; Python 3.12.16에서는 exit 5, `Ran 0 tests`, `NO TESTS RAN`. 두 경우 모두 실행된 테스트는 0개였다."
    - command: "cd examples/unittest-discovery && python3 -m unittest discover -s tests -p 'test_*.py' -v"
      result: "커밋 2a8882f 기준 Python 3.9.6과 3.12.16에서 각각 exit 0. test_round_trip_preserves_fields와 test_sorted_encoding_is_stable가 각각 ok였고 `Ran 2 tests` 및 `OK`를 관찰했다."
  run:
