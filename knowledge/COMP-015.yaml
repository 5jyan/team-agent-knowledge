schema_version: 1
type: bugfix
id: COMP-015
status: active
title: 필수 설정이 빠졌을 때 누락 항목 모두 안내
revision: r2
summary: 가상 설정 검사 예제에서 model과 version 중 빠진 항목의 이름을 모두 안내한다.
problem:
  statement: 누락된 설정이 여럿이어도 하나만 알려주면 사용자가 나머지 누락을 한 번에 알기 어렵다.
cause:
  statement: r1 예제는 model 키의 존재만 검사하므로 version 누락을 확인하지 않는다.
solution:
  statement: 'model과 version 키를 검사해 빠진 항목을 모두 표시한다. 둘 다 없으면 설정 오류: model, version
    항목이 없습니다. 둘 다 있으면 설정 정상이다.'
limitations:
- condition: 설정 키 이외의 값의 유효성 또는 다른 설정 검사기
  action: 이 예제만으로 판단하지 말고 별도 요구사항과 테스트를 확인한다.
- condition: 설정 값에 민감한 정보가 들어 있는 경우
  action: 오류 메시지에 설정 값을 출력하지 않는다.
scope:
  applies_when:
  - 이 저장소의 가상 설정 검사 예제에서 model과 version 키의 존재를 확인한다.
  does_not_apply_when:
  - 설정값의 타입·유효성, 다른 필수 항목, 실제 제품의 설정 정책을 이 예제만으로 판단한다.
evidence:
  repository: https://github.com/5jyan/team-agent-knowledge
  commit: f712c83919e17bfcbd9de099b0deef00c54ecaee
  verified_at: '2026-10-31T13:27:41.229249+00:00'
  tests:
  - command: python3 -m unittest discover -s examples/config-validation -p 'test_*.py'
      -v
    result: Python 3.12에서 5개 통과. model 누락, version 누락, 동시 누락, 정상 입력, 설정값 미노출을 확인했다.
  run:
    command: python3 examples/config-validation/run_demo.py
    result: '둘 다 없으면 설정 오류: model, version 항목이 없습니다. model만 없으면 model 항목 누락을, 둘 다
      있으면 설정 정상을 출력했다.'
maintenance:
  owner: 5jyan
  review_after: '2027-01-31'
  update_trigger: 필수 항목 또는 설정 검사의 오류 메시지가 바뀔 때
references:
- https://github.com/5jyan/team-agent-knowledge/commit/d79cb31e42ca2b7a66029232fbc0ad07290a7c58
- https://github.com/5jyan/team-agent-knowledge/commit/f712c83919e17bfcbd9de099b0deef00c54ecaee
