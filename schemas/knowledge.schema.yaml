$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.invalid/team-agent-knowledge/knowledge.schema.yaml
title: Team compiler knowledge record
description: >-
  Canonical, reviewed knowledge kept in Git before it is published to Hindsight.
type: object
additionalProperties: false
required:
  - schema_version
  - type
  - id
  - status
  - title
  - summary
  - problem
  - cause
  - solution
  - limitations
  - scope
  - evidence
  - maintenance
  - references
properties:
  schema_version:
    type: integer
    const: 1
  type:
    type: string
    const: bugfix
  id:
    type: string
    pattern: '^COMP-[0-9]{3}$'
    description: Stable knowledge identifier.
  status:
    type: string
    enum: [active, retired]
  title:
    type: string
    minLength: 1
  revision:
    type: string
    minLength: 1
  summary:
    type: string
    minLength: 1
  problem:
    $ref: '#/$defs/statement'
  cause:
    $ref: '#/$defs/statement'
  solution:
    $ref: '#/$defs/statement'
  limitations:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [condition, action]
      properties:
        condition:
          type: string
          minLength: 1
        action:
          type: string
          minLength: 1
  scope:
    type: object
    additionalProperties: false
    required: [applies_when, does_not_apply_when]
    properties:
      applies_when:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      does_not_apply_when:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
  evidence:
    type: object
    additionalProperties: false
    required: [repository, commit, verified_at, tests, run]
    properties:
      repository:
        type: string
        minLength: 1
      commit:
        type: string
        pattern: '^[0-9a-fA-F]{40}$'
      verified_at:
        type: string
        format: date-time
      tests:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [command, result]
          properties:
            command: {type: string, minLength: 1}
            result: {type: string, minLength: 1}
      run:
        type: object
        additionalProperties: false
        required: [command, result]
        properties:
          command: {type: string, minLength: 1}
          result: {type: string, minLength: 1}
      ci_run_url:
        type: string
        format: uri-reference
  maintenance:
    type: object
    additionalProperties: false
    required: [owner, review_after, update_trigger]
    properties:
      owner: {type: string, minLength: 1}
      review_after: {type: string, minLength: 1}
      update_trigger: {type: string, minLength: 1}
  references:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
      format: uri-reference
$defs:
  statement:
    type: object
    additionalProperties: false
    required: [statement]
    properties:
      statement:
        type: string
        minLength: 1
